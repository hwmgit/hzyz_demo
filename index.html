<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>软剑熊案例展示系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%239f1f24'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-size='22' font-family='Arial' font-weight='700' fill='white'%3ERX%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="portal-body">
  <main class="portal-shell">
    <section class="portal-hero">
      <div class="portal-copy">
        <span class="portal-badge">Software Bear Case Hub</span>
        <h1>软剑熊案例展示系统</h1>
        <p>系统拆分为两个独立入口：首页只负责进入客户展示端或后台管理端。客户展示端面向潜在客户呈现案例、服务能力和咨询链路，后台管理端用于维护案例与资料内容。</p>
        <div class="portal-actions">
          <a class="portal-primary" href="./mini.html">进入小程序端</a>
          <a class="portal-secondary" href="./admin.html">进入管理端</a>
        </div>
      </div>
      <div class="portal-visual">
        <div class="portal-card portal-card-main">
          <img src="资料/收银台01.jpg" alt="软剑熊收银台部署">
          <div>
            <strong>客户展示端</strong>
            <span>案例、服务能力、设备方案、咨询转化</span>
          </div>
        </div>
        <div class="portal-card portal-card-side">
          <img src="资料/上门服务工单.jpg" alt="软剑熊服务工单">
          <div>
            <strong>后台管理端</strong>
            <span>案例维护、素材管理、线索与工单</span>
          </div>
        </div>
      </div>
    </section>

    <section class="portal-summary">
      <article class="summary-panel">
        <h2>本轮调整</h2>
        <p>首页作为系统入口，不再把小程序端和管理端堆在同一屏内。访问路径更清晰，客户先理解角色分工，再进入对应工作界面。</p>
      </article>
      <article class="summary-panel">
        <h2>当前重点</h2>
        <p>客户展示端已重构为可点击、可切换、可进入详情的移动界面；后台管理端继续扩展为可查看、可编辑、可上传资料的案例运营系统。</p>
      </article>
    </section>
  </main>
</body>
</html>
